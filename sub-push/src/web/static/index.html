<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅结果</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="tabs">
      <button v-for="(tab, idx) in tabs" :key="idx" @click="switchTab(idx, tab.file)" :class="{active: activeTab === idx}">
        {{ tab.name }}
      </button>
    </div>
    <div class="grid">
      <a class="card" v-for="item in items" :key="item.id" :href="getItemLink(item)" target="_blank" rel="noopener noreferrer">
        <img :src="item.thumbnail" alt="" />
        <div class="title">{{ item.name }}</div>
        <div class="price">¥{{ item.price }}</div>
        <div class="site">{{ item.source_site || 'mercari' }}</div>
      </a>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
